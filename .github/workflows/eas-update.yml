# Publishes an EAS Update on every push to master, so the Expo Go build at
# expo.dev/accounts/mrsauron/projects/office-gym-trainer/updates/production
# stays in sync with the code without a manual `eas update` each time.
name: Publish EAS Update

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: npx eas-cli update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive
