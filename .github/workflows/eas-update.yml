# Publish updates only to compatible production native builds.
name: Publish EAS Update

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand --testTimeout=20000

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --channel production --environment production --message "$UPDATE_MESSAGE" --non-interactive
        env:
          EXPO_NO_DOTENV: 1
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'Publish production update' }}
