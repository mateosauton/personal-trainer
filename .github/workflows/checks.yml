name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: recovery-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand --testTimeout=20000
      - run: npm run test:recovery-db
        env:
          PT_LIFECYCLE_DB_URL: postgresql://postgres:recovery-test@127.0.0.1:5432/postgres
          PT_ORDERING_DB_URL: postgresql://postgres:recovery-test@127.0.0.1:5432/postgres
