name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Core and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: recovery-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      # Only the exact offline fixture is available to tests. Bundling uses its
      # own synthetic config and writes outside deployable dist.
      APP_ENV: mock
      EXPO_PUBLIC_APP_ENV: mock
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_LOCAL_TEST_FIXTURE_ONLY
      PT_LIFECYCLE_DB_URL: postgresql://postgres:recovery-test@127.0.0.1:5432/postgres
      PT_ORDERING_DB_URL: postgresql://postgres:recovery-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check types, behavior, safety, fresh schema, and baseline upgrade
        run: npm run check:web
      - name: Check web bundling without producing a release artifact
        run: npm run build:web:check
